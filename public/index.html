<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Rentor · Bill Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f9fafb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.03), 0 2px 4px rgba(0, 0, 0, 0.02);
            padding: 2rem 1.75rem;
            transition: all 0.2s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-icon {
            background: #f0f4fe;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .logo-icon i {
            font-size: 28px;
            color: #2c3e8f;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #111827;
            margin-bottom: 0.25rem;
        }

        .sub {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1.8rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.5rem;
            font-size: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            background: #ffffff;
            transition: all 0.2s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #2c3e8f;
            box-shadow: 0 0 0 3px rgba(44, 62, 143, 0.1);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: #2c3e8f;
            color: white;
            border: none;
            border-radius: 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #1f2d6b;
        }

        .demo-hint {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #9ca3af;
            border-top: 1px solid #f0f2f5;
            padding-top: 1.2rem;
        }

        .alert {
            padding: 0.85rem 1rem;
            border-radius: 20px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            background: #fee2e2;
            color: #b91c1c;
            border-left: 3px solid #b91c1c;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.75rem 1.25rem;
            }
            input, button {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-home"></i>
            </div>
            <h1>Rentor</h1>
            <div class="sub">Bill tracker for tenants</div>
        </div>

        <div id="alertMessage"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="e.g., admin" autocomplete="username" required>
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••" autocomplete="current-password" required>
                </div>
            </div>
            <button type="submit">Log in →</button>
        </form>
        <div class="demo-hint">
            <i class="fas fa-mobile-alt"></i> Demo: admin / admin123
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const alertDiv = document.getElementById('alertMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                // Register service worker & redirect
                if ('serviceWorker' in navigator) {
                    try {
                        await navigator.serviceWorker.register('/sw.js');
                    } catch (err) { console.warn(err); }
                }
                window.location.href = '/dashboard.html';
            } else {
                showAlert(data.error || 'Invalid credentials', 'error');
            }
        } catch (err) {
            showAlert('Network error. Try again.', 'error');
        }
    });

    function showAlert(msg, type) {
        alertDiv.innerHTML = `<div class="alert">${msg}</div>`;
        setTimeout(() => alertDiv.innerHTML = '', 3000);
    }

    // PWA manifest and service worker pre‑registration (optional)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(console.warn);
        });
    }
</script>
</body>
</html>
