<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Rentor · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f5f7fb; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1.5rem; }
        .card { max-width:400px; width:100%; background:white; border-radius:32px; padding:2rem 1.75rem; box-shadow:0 8px 30px rgba(0,0,0,0.03); }
        .logo { text-align:center; margin-bottom:1.8rem; }
        .logo i { font-size:2.5rem; background:#f0f4fe; padding:0.8rem; border-radius:50%; color:#2c3e8f; }
        h1 { font-size:1.8rem; font-weight:600; margin-top:0.5rem; }
        .sub { color:#6b7280; margin-bottom:1.8rem; }
        input { width:100%; padding:0.9rem 1rem; border:1px solid #e5e7eb; border-radius:20px; margin-bottom:1rem; font-family:inherit; }
        button { width:100%; padding:0.9rem; background:#2c3e8f; color:white; border:none; border-radius:28px; font-weight:600; cursor:pointer; }
        .alert { background:#fee2e2; color:#b91c1c; padding:0.75rem; border-radius:20px; margin-bottom:1rem; }
        .demo-hint { text-align:center; margin-top:1.5rem; font-size:0.75rem; color:#9ca3af; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><i class="fas fa-home"></i><h1>Rentor</h1><div class="sub">Bill tracker for tenants</div></div>
    <div id="alert"></div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Log in →</button>
    </form>
    <div class="demo-hint"><i class="fas fa-mobile-alt"></i> Demo: admin / admin123</div>
</div>
<script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
                window.location.href = '/dashboard.html';
            } else {
                document.getElementById('alert').innerHTML = `<div class="alert">${data.error}</div>`;
            }
        } catch(err) {
            document.getElementById('alert').innerHTML = `<div class="alert">Network error</div>`;
        }
    });
</script>
</body>
</html>
