<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Rentor · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 2rem 1.8rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s ease;
        }
        .logo {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        .logo-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 70px;
            height: 70px;
            border-radius: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .logo-icon i {
            font-size: 2rem;
            color: white;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1e1b4b 0%, #2c3e8f 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .sub {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .input-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1.1rem;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.5rem;
            font-size: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 28px;
            background: #ffffff;
            transition: all 0.2s;
            font-family: inherit;
            outline: none;
        }
        input:focus {
            border-color: #2c3e8f;
            box-shadow: 0 0 0 3px rgba(44, 62, 143, 0.1);
        }
        /* Mask password field (Chrome, Edge, Safari) */
        #password {
            -webkit-text-security: disc;
            font-family: monospace;
            letter-spacing: 1px;
        }
        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #2c3e8f 0%, #1e1b4b 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        button:active {
            transform: scale(0.98);
        }
        .demo-hint {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #6b7280;
            border-top: 1px solid #eef2f6;
            padding-top: 1.2rem;
        }
        .alert {
            padding: 0.85rem 1rem;
            border-radius: 20px;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            background: #fee2e2;
            color: #b91c1c;
            border-left: 3px solid #b91c1c;
        }
        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-home"></i>
            </div>
            <h1>Rentor</h1>
            <div class="sub">Bill tracker for tenants</div>
        </div>

        <div id="alertMessage"></div>

        <!-- Form with autocomplete prevention and masked password field -->
        <form id="loginForm" autocomplete="off">
            <!-- Hidden dummy fields to confuse password managers -->
            <input type="text" style="display:none">
            <input type="password" style="display:none">

            <div class="input-group">
                <label>Username</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="e.g., admin" autocomplete="off" required>
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="text" id="password" placeholder="Enter your password" autocomplete="off" required>
                </div>
            </div>
            <button type="submit">Log in →</button>
        </form>
        <!-- <div class="demo-hint">
            <i class="fas fa-mobile-alt"></i>G
        </div> -->
    </div>
</div>

<script>
    // Firefox fallback: if browser is Firefox, revert to type="password" (still might trigger password manager, but better than plain text)
    if (navigator.userAgent.includes('Firefox')) {
        const pwdField = document.getElementById('password');
        if (pwdField) pwdField.type = 'password';
    }

    const form = document.getElementById('loginForm');
    const alertDiv = document.getElementById('alertMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if ('serviceWorker' in navigator) {
                    try {
                        await navigator.serviceWorker.register('/sw.js');
                    } catch (err) { console.warn(err); }
                }
                window.location.href = '/dashboard.html';
            } else {
                showAlert(data.error || 'Invalid credentials', 'error');
            }
        } catch (err) {
            showAlert('Network error. Try again.', 'error');
        }
    });

    function showAlert(msg, type) {
        alertDiv.innerHTML = `<div class="alert">${msg}</div>`;
        setTimeout(() => alertDiv.innerHTML = '', 3000);
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(console.warn);
        });
    }
</script>
</body>
</html>
