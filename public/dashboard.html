<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Rentor · Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f9fafb">
</head>
<body>
<div class="app">
    <div class="header">
        <div class="welcome-row">
            <div class="greeting">
                <h2 id="welcomeMessage">Hello</h2>
                <p id="userDetail"></p>
            </div>
            <div class="role-badge" id="roleBadge"></div>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Loading...</div>
    </div>
    <div class="bottom-nav">
        <button class="nav-item" data-section="dashboard"><i class="fas fa-chart-simple"></i><span>Home</span></button>
        <button class="nav-item" data-section="bills"><i class="fas fa-receipt"></i><span>Bills</span></button>
        <button class="nav-item" data-section="messages"><i class="fas fa-envelope"></i><span>Messages</span></button>
        <button class="nav-item" id="adminNavBtn" style="display: none;" data-section="users"><i class="fas fa-users"></i><span>Tenants</span></button>
        <button class="nav-item" id="specialNavBtn" style="display: none;" data-section="addBill"><i class="fas fa-plus-circle"></i><span>Add Bill</span></button>
        <button class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Exit</span></button>
    </div>
</div>

<script>
    // --- globals ---
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    let currentUser = null;
    let allClients = [];
    let allBills = [];
    window.deleteBill = async (billId) => {
    if (!confirm('Delete this bill permanently? This action cannot be undone.')) return;
    try {
        const res = await fetch(`/api/bills/${billId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error(await res.text());
        alert('Bill deleted');
        await loadData();         // refresh bills list
        showSection('bills');     // re-render bills tab
    } catch (err) {
        alert('Delete failed: ' + err.message);
    }
};

window.markPaid = async (billId) => {
    if (!confirm('Mark this bill as paid?')) return;
    try {
        await fetch(`/api/bills/${billId}/pay`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        await loadData();
        showSection('bills');
    } catch(e) { alert('Error marking paid: ' + e.message); }
};

window.onload = async () => {
    await loadUser();          // sets currentUser and token
    await loadData();
    showSection('dashboard');

    // Heartbeat every 30 seconds (only if logged in)
    setInterval(async () => {
        if (token) {
            try {
                await fetch('/api/heartbeat', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch(e) { console.warn('Heartbeat failed', e); }
        }
    }, 30000);
};

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

    // --- API helpers ---
    async function apiGet(url) {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
        return res.json();
    }
    async function apiPost(url, body) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
        return res.json();
    }
    async function apiDelete(url) {
        const res = await fetch(url, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error((await res.json()).error || 'Delete failed');
        return res.json();
    }

    // --- load current user ---
    async function loadUser() {
        try {
            currentUser = await apiGet('/api/users/me');
            localStorage.setItem('user', JSON.stringify(currentUser));
            document.getElementById('welcomeMessage').innerHTML = `👋 ${currentUser.name.split(' ')[0]}`;
            document.getElementById('userDetail').innerHTML = `${currentUser.room ? `Rm ${currentUser.room} · ` : ''}${currentUser.role === 'client' ? 'Tenant' : currentUser.role}`;
            document.getElementById('roleBadge').innerText = currentUser.role.toUpperCase();
            if (currentUser.role === 'admin') {
                document.getElementById('adminNavBtn').style.display = 'flex';
                document.getElementById('specialNavBtn').style.display = 'flex';
            } else if (currentUser.role === 'special') {
                document.getElementById('specialNavBtn').style.display = 'flex';
            }
        } catch(e) { logout(); }
    }

    async function loadData() {
        try {
            const [clientsRes, billsRes] = await Promise.all([
                apiGet('/api/users/clients'),
                apiGet('/api/bills')
            ]);
            allClients = clientsRes;
            allBills = billsRes;
        } catch(e) { console.warn(e); }
    }

    // --- Render functions (they receive container and use global data) ---
    function renderDashboard(container) {
        const pending = allBills.filter(b => b.status === 'pending').length;
        const paid = allBills.filter(b => b.status === 'paid').length;
        const totalDue = allBills.filter(b => b.status === 'pending').reduce((s,b) => s + b.amount, 0);
        const recent = allBills.slice(0, 5);
        container.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${pending}</div><div class="stat-label">Pending</div></div>
                <div class="stat-card"><div class="stat-number">${paid}</div><div class="stat-label">Paid</div></div>
                <div class="stat-card"><div class="stat-number">₱${totalDue.toLocaleString()}</div><div class="stat-label">Due</div></div>
            </div>
            <div class="card"><div class="card-header">📋 Recent bills</div><div class="card-body">
                ${recent.length ? recent.map(b => `
                    <div class="bill-item"><div class="bill-row">
                        <span><strong>${b.description}</strong><br><small>Due ${new Date(b.dueDate).toLocaleDateString()}</small></span>
                        <span>₱${b.amount.toLocaleString()} <span class="badge ${b.status === 'pending' ? 'badge-pending' : 'badge-paid'}">${b.status}</span></span>
                    </div></div>
                `).join('') : '<div class="empty-state">No bills yet</div>'}
            </div></div>
        `;
    }

// Global filter state (persist when switching tabs)
let billsFilter = {
    search: '',
    status: 'all',
    category: 'all'
};

async function renderBills(container) {
    if (!allBills.length) {
        container.innerHTML = `<div class="card"><div class="card-body"><div class="empty-state">No bills found.</div></div></div>`;
        return;
    }

    // Extract unique categories from all bills (for dropdown)
    const categoriesSet = new Set();
    allBills.forEach(b => { if (b.description) categoriesSet.add(b.description); });
    const categories = Array.from(categoriesSet).sort();

    // Apply filters
    let filtered = [...allBills];

    // Search filter (tenant name or description)
    if (billsFilter.search.trim() !== '') {
        const term = billsFilter.search.toLowerCase();
        filtered = filtered.filter(bill => {
            const tenantName = bill.clientId?.name?.toLowerCase() || '';
            const description = bill.description?.toLowerCase() || '';
            return tenantName.includes(term) || description.includes(term);
        });
    }

    // Status filter
    if (billsFilter.status !== 'all') {
        filtered = filtered.filter(bill => bill.status === billsFilter.status);
    }

    // Category filter
    if (billsFilter.category !== 'all') {
        filtered = filtered.filter(bill => bill.description === billsFilter.category);
    }

    // Build filter bar HTML
    const filterBarHtml = `
    <div class="filter-bar-modern">
        <div class="filter-group filter-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="billsSearchInput" placeholder="Search tenant or bill..." value="${escapeHtml(billsFilter.search)}">
        </div>
        <div class="filter-group">
            <select id="billsStatusFilter">
                <option value="all" ${billsFilter.status === 'all' ? 'selected' : ''}>All status</option>
                <option value="pending" ${billsFilter.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="paid" ${billsFilter.status === 'paid' ? 'selected' : ''}>Paid</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="billsCategoryFilter">
                <option value="all" ${billsFilter.category === 'all' ? 'selected' : ''}>All categories</option>
                ${categories.map(cat => `<option value="${escapeHtml(cat)}" ${billsFilter.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
            </select>
        </div>
        <button class="reset-modern" id="billsResetFiltersBtn">
            <i class="fas fa-times-circle"></i> Reset
        </button>
    </div>
`;

    if (filtered.length === 0) {
        container.innerHTML = filterBarHtml + `<div class="empty-state">No bills match your filters.</div>`;
        attachFilterEvents();
        return;
    }

    // Group filtered bills by client
    const billsByClient = new Map();
    for (const bill of filtered) {
        const client = bill.clientId;
        if (!client) continue;
        const clientId = client._id;
        if (!billsByClient.has(clientId)) {
            billsByClient.set(clientId, {
                clientName: client.name,
                clientRoom: client.room,
                clientLevel: client.level,
                bills: []
            });
        }
        billsByClient.get(clientId).bills.push(bill);
    }

    // Generate HTML for each client
    let clientsHtml = '';
    for (const [clientId, clientData] of billsByClient) {
        // Group by description within client
        const groupedByDesc = new Map();
        for (const bill of clientData.bills) {
            const desc = bill.description;
            if (!groupedByDesc.has(desc)) groupedByDesc.set(desc, []);
            groupedByDesc.get(desc).push(bill);
        }

        clientsHtml += `
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header">
                    <strong>${escapeHtml(clientData.clientName)}</strong> 
                    <span style="font-size:0.8rem; color:#6b7280;">(Rm ${escapeHtml(clientData.clientRoom)}, ${escapeHtml(clientData.clientLevel)})</span>
                </div>
                <div class="card-body">
        `;

        for (const [category, bills] of groupedByDesc) {
            const sortedBills = [...bills].sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
            clientsHtml += `
                <div style="margin-bottom: 1rem;">
                    <div style="font-weight:600; margin-bottom:0.5rem;">${escapeHtml(category)}</div>
                    <div style="margin-left: 0.5rem;">
            `;
            for (const bill of sortedBills) {
                const dueDate = new Date(bill.dueDate);
                const monthYear = dueDate.toLocaleString('default', { month: 'short', year: 'numeric' });
                clientsHtml += `
                    <div class="bill-item" style="display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0;">
                        <div>
                            ${monthYear} — ₱${bill.amount.toLocaleString()}
                            <span class="badge ${bill.status === 'pending' ? 'badge-pending' : 'badge-paid'}" style="margin-left:0.5rem;">${bill.status}</span>
                        </div>
                        <div>
                            ${bill.status === 'pending' && (currentUser.role === 'admin' || currentUser.role === 'special') ? 
                                `<button class="small" onclick="markPaid('${bill._id}')">✔ Mark paid</button>` : ''
                            }
                            ${(currentUser.role === 'admin' || currentUser.role === 'special') ? 
                                `<button class="small" onclick="deleteBill('${bill._id}')" style="background:#fee2e2; color:#b91c1c;">🗑 Delete</button>` : ''
                            }
                        </div>
                    </div>
                `;
            }
            clientsHtml += `</div></div>`;
        }
        clientsHtml += `</div></div>`;
    }

    container.innerHTML = filterBarHtml + clientsHtml;
    attachFilterEvents();
}

function attachFilterEvents() {
    const searchInput = document.getElementById('billsSearchInput');
    const statusSelect = document.getElementById('billsStatusFilter');
    const categorySelect = document.getElementById('billsCategoryFilter');
    const resetBtn = document.getElementById('billsResetFiltersBtn');

    const updateFilters = () => {
        billsFilter.search = searchInput ? searchInput.value : '';
        billsFilter.status = statusSelect ? statusSelect.value : 'all';
        billsFilter.category = categorySelect ? categorySelect.value : 'all';
        showSection('bills');
    };

    if (searchInput) searchInput.addEventListener('input', updateFilters);
    if (statusSelect) statusSelect.addEventListener('change', updateFilters);
    if (categorySelect) categorySelect.addEventListener('change', updateFilters);
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            if (searchInput) searchInput.value = '';
            if (statusSelect) statusSelect.value = 'all';
            if (categorySelect) categorySelect.value = 'all';
            billsFilter.search = '';
            billsFilter.status = 'all';
            billsFilter.category = 'all';
            showSection('bills');
        });
    }
}
   function renderAddBill(container) {
        container.innerHTML = `
            <div class="card"><div class="card-header">➕ Add new bill</div><div class="card-body">
                <form id="billFormSimple">
                    <select id="clientIdSimple" required>${allClients.filter(c => c.role === 'client').map(c => `<option value="${c._id}">${c.name} (Rm ${c.room})</option>`).join('')}</select>
                    <input type="text" placeholder="Description (e.g. Rent Sep)" id="descSimple" required>
                    <input type="number" placeholder="Amount (₱)" id="amountSimple" required>
                    <input type="date" id="dueDateSimple" required>
                    <button class="primary-btn" type="submit" id="createBillBtn">Create bill</button>
                </form>
            </div></div>
        `;
        const form = document.getElementById('billFormSimple');
        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createBillBtn');
            const original = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Creating...';
            btn.disabled = true;
            const data = {
                clientId: document.getElementById('clientIdSimple').value,
                description: document.getElementById('descSimple').value,
                amount: parseFloat(document.getElementById('amountSimple').value),
                dueDate: document.getElementById('dueDateSimple').value
            };
            try {
                await apiPost('/api/bills', data);
                await loadData();
                showSection('bills');
            } catch(err) { alert(err.message); btn.innerHTML = original; btn.disabled = false; }
        });
    }

    // ==================== MESSAGING (grouped conversations) ====================
let currentChatUserId = null;
let allContacts = [];

async function renderMessages(container) {
    container.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading...</div>`;

    const contacts = await apiGet('/api/messages/contacts');
    allContacts = contacts;

    let contactsHtml = `<div class="contacts-list">`;
    if (contacts.length === 0) {
        contactsHtml += `<div class="empty-state" style="padding:2rem;">No conversations yet. Start a new chat below.</div>`;
    } else {
        contacts.forEach(contact => {
            const isOnline = contact.lastSeen && (new Date() - new Date(contact.lastSeen) < 2 * 60 * 1000);
            const avatarInitial = contact.name.charAt(0).toUpperCase();
            contactsHtml += `
                <div class="contact-item" data-user-id="${contact._id}" data-user-name="${contact.name}">
                    <div style="position:relative;">
                        <div class="avatar">${avatarInitial}</div>
                        ${isOnline ? '<div class="online-dot"></div>' : ''}
                    </div>
                    <div class="contact-info">
                        <div class="contact-name">${escapeHtml(contact.name)}</div>
                        <div class="contact-lastseen">${isOnline ? 'Online' : (contact.lastSeen ? `Last seen ${new Date(contact.lastSeen).toLocaleString()}` : 'Offline')}</div>
                    </div>
                </div>
            `;
        });
    }
    contactsHtml += `</div>`;

    if (currentUser.role !== 'client') {
        contactsHtml += `
            <div class="card" style="margin-top:1rem;">
                <div class="card-header">Start new chat</div>
                <div class="card-body">
                    <select id="newChatSelect" style="width:100%;">
                        <option value="">Select tenant...</option>
                        ${allClients.filter(c => c.role === 'client').map(c => `<option value="${c._id}" data-name="${c.name}" data-username="${c.username}">${c.name} (${c.room})</option>`).join('')}
                    </select>
                    <button class="primary-btn" id="startNewChatBtn" style="margin-top:0.5rem;">Message</button>
                </div>
            </div>
        `;
    }

    const chatHtml = `
        <div class="chat-view" id="chatView">
            <div class="back-to-contacts"><button class="small" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button></div>
            <div class="chat-header" style="padding:1rem; border-bottom:1px solid #f0f2f5; font-weight:600;" id="chatHeader"></div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message...">
                <button class="primary-btn" id="sendChatBtn" style="width:auto; padding:0.7rem 1.2rem;">Send</button>
            </div>
        </div>
    `;

    container.innerHTML = `<div class="messages-container">${contactsHtml}${chatHtml}</div>`;

    // Contact click handlers
    document.querySelectorAll('.contact-item').forEach(el => {
        el.addEventListener('click', async () => {
            const userId = el.getAttribute('data-user-id');
            const userName = el.getAttribute('data-user-name');
            await openChat(userId, userName);
        });
    });

    // Start new chat
    const newChatSelect = document.getElementById('newChatSelect');
    const startBtn = document.getElementById('startNewChatBtn');
    if (startBtn) {
        startBtn.addEventListener('click', async () => {
            const selected = newChatSelect.value;
            if (!selected) return;
            const option = newChatSelect.options[newChatSelect.selectedIndex];
            const name = option.getAttribute('data-name');
            await openChat(selected, name);
        });
    }

    // Back button – close chat view
    document.getElementById('backBtn')?.addEventListener('click', () => {
        const chatView = document.getElementById('chatView');
        chatView.style.display = 'none';
        chatView.classList.remove('active-mobile');
        currentChatUserId = null;
    });

    // Send message handler
    const sendBtn = document.getElementById('sendChatBtn');
    const chatInput = document.getElementById('chatInput');
    const sendMessage = async () => {
        if (!currentChatUserId) return;
        const text = chatInput.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
        try {
            const recipientUser = allContacts.find(c => c._id === currentChatUserId) || 
                                  allClients.find(c => c._id === currentChatUserId);
            const toUsername = recipientUser?.username;
            if (!toUsername) throw new Error('Recipient not found');
            await apiPost('/api/messages', { toUsername, subject: 'Chat', message: text });
            chatInput.value = '';
            await openChat(currentChatUserId, '');
        } catch(err) { alert(err.message); }
        finally { sendBtn.disabled = false; sendBtn.innerHTML = 'Send'; }
    };
    sendBtn?.addEventListener('click', sendMessage);
    chatInput?.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
}

        <div class="card"><div class="card-header">👥 Tenants & staff</div><div class="card-body">
            ${allClients.map(u => `<div class="user-item"><div><strong>${escapeHtml(u.name)}</strong> (${escapeHtml(u.username)})<br><small>${u.room ? `Rm ${u.room} Lv.${u.level}` : ''} · ${u.role}</small></div></div>`).join('')}
        </div></div>
        <div class="card"><div class="card-header">➕ Register new tenant</div><div class="card-body">
            <form id="registerFormSimple">

                <input type="text" placeholder="Username" id="regUsername" required>

        try {

            };

}

async function openChat(userId, userName) {
    console.log('openChat called', userId, userName);
    currentChatUserId = userId;
    const chatView = document.getElementById('chatView');
    const chatHeader = document.getElementById('chatHeader');
    const chatMessagesDiv = document.getElementById('chatMessages');
    if (!chatView || !chatHeader || !chatMessagesDiv) {
        console.error('Chat elements not found');
        return;
    }
    chatHeader.innerHTML = `<i class="fas fa-user-circle"></i> ${escapeHtml(userName)}`;
    chatMessagesDiv.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading messages...</div>';
    chatView.style.display = 'flex';
    if (window.innerWidth <= 600) chatView.classList.add('active-mobile');

    try {
        const messages = await apiGet(`/api/messages?withUserId=${userId}`);
        const sorted = [...messages].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        chatMessagesDiv.innerHTML = '';
        
        if (sorted.length === 0) {
            chatMessagesDiv.innerHTML = '<div class="empty-state">No messages yet. Send a message to start the conversation.</div>';
            return;
        }

        for (const msg of sorted) {
            // Safely get sender ID
            let senderId = msg.fromUser;
            if (msg.fromUser && typeof msg.fromUser === 'object') {
                senderId = msg.fromUser._id;
            }
            // Determine if this message is from the current user
            const isOutgoing = String(senderId) === String(currentUser.id);
            
            // Create message row with inline styles for guaranteed alignment
            const row = document.createElement('div');
            row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
            row.style.display = 'flex';
            row.style.width = '100%';
            row.style.justifyContent = isOutgoing ? 'flex-end' : 'flex-start';
            
            // Bubble styling
            const bubbleStyle = isOutgoing
                ? 'background: #2c3e8f; color: white; border-bottom-right-radius: 4px;'
                : 'background: #f3f4f6; color: #1f2937; border-bottom-left-radius: 4px;';
            
            row.innerHTML = `
                <div class="message-bubble" style="max-width: 80%; padding: 0.6rem 1rem; border-radius: 20px; word-wrap: break-word; ${bubbleStyle}">
                    <div>${escapeHtml(msg.message)}</div>
                    <div class="message-meta" style="font-size: 0.65rem; margin-top: 0.25rem; display: flex; gap: 0.5rem;">
                        <span>${new Date(msg.createdAt).toLocaleString()}</span>
                        ${isOutgoing ? (msg.isRead ? '<i class="fas fa-check-double"></i>' : '<i class="fas fa-check"></i>') : ''}
                    </div>
                </div>
            `;
            chatMessagesDiv.appendChild(row);
        }
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    } catch (err) {
        console.error('Error loading messages:', err);
        chatMessagesDiv.innerHTML = '<div class="empty-state">Failed to load messages.</div>';
    }
}

    function composeFormHtml() {
        return `
            <form id="msgForm">
                <input type="text" placeholder="To (username)" id="msgTo" required ${currentUser.role === 'client' ? 'value="admin"' : ''}>
                <input type="text" placeholder="Subject" id="msgSubject" required>
                <textarea rows="2" placeholder="Message" id="msgBody" required></textarea>
                <button class="primary-btn" type="submit" id="sendMsgBtn">Send Message</button>
            </form>
        `;
    }

    function attachConversationHandlers() {
        document.querySelectorAll('.conversation-header').forEach(header => {
            header.addEventListener('click', (e) => {
                if (e.target.closest('.delete-conv-btn')) return;
                const convDiv = header.closest('.conversation-item').querySelector('.conversation-messages');
                if (convDiv) convDiv.style.display = convDiv.style.display === 'none' ? 'block' : 'none';
            });
        });
        document.querySelectorAll('.delete-conv-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (!confirm('Delete this entire conversation?')) return;
                const userId = btn.getAttribute('data-user-id');
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
                btn.disabled = true;
                try {
                    await apiDelete(`/api/messages/conversation/${userId}`);
                    showSection('messages');
                } catch(err) { alert(err.message); btn.innerHTML = '<i class="fas fa-trash"></i>'; btn.disabled = false; }
            });
        });
        document.querySelectorAll('.send-reply-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const userId = btn.getAttribute('data-user-id');
                const convItem = btn.closest('.conversation-item');
                const recipientUsername = convItem.getAttribute('data-username');
                const textarea = btn.closest('.reply-area')?.querySelector('.reply-text');
                const reply = textarea?.value.trim();
                if (!reply) return;
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
                btn.disabled = true;
                try {
                    await apiPost('/api/messages', { toUsername: recipientUsername, subject: 'Reply', message: reply });
                    textarea.value = '';
                    showSection('messages');
                } catch(err) { alert(err.message); btn.innerHTML = 'Send Reply'; btn.disabled = false; }
            });
        });
    }

    function attachComposeHandler() {
        const form = document.getElementById('msgForm');
        if (!form) return;
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const to = document.getElementById('msgTo').value.trim();
            const subject = document.getElementById('msgSubject').value.trim();
            const message = document.getElementById('msgBody').value.trim();
            if (!to || !subject || !message) return;
            const sendBtn = document.getElementById('sendMsgBtn');
            const original = sendBtn.innerText;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            sendBtn.disabled = true;
            try {
                await apiPost('/api/messages', { toUsername: to, subject, message });
                document.getElementById('msgSubject').value = '';
                document.getElementById('msgBody').value = '';
                showSection('messages');
            } catch(err) { alert(err.message); sendBtn.innerHTML = original; sendBtn.disabled = false; }
        });
    }

    // --- Push notifications (unchanged) ---
    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }
    async function setupPush() {
        if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
        let permission = Notification.permission;
        if (permission !== 'granted') permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
        try {
            const reg = await navigator.serviceWorker.ready;
            const VAPID_PUBLIC_KEY = 'BPK3tZcxZtJqBqHpN8fW8cX9EfVq1y2w3x4a5b6c7d8e9f0g1h2i3j4k5l6m7n8'; // replace with your actual key
            const subscription = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
            await fetch('/api/push/subscribe', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ subscription })
            });
        } catch(e) { console.warn('Push subscription failed', e); }
    }

    // --- Navigation with loading indicator ---
    let isLoading = false;
    async function showSection(section) {
        if (isLoading) return;
        isLoading = true;
        const container = document.getElementById('mainContent');
        // Show spinner immediately
        container.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Loading ${section}...</div>`;

        try {
            // For dashboard, bills, users, addBill we need fresh bills/clients data.
            // For messages, we also need fresh messages (but that's inside renderMessages).
            if (section !== 'messages') {
                await loadData();
            } else {
                // For messages we still need currentUser but not bills/clients.
                // However loadData is cheap, we can still call it to keep data fresh.
                await loadData(); // optional, but keeps other tabs fresh.
            }

            if (section === 'dashboard') renderDashboard(container);
            else if (section === 'bills') renderBills(container);
            else if (section === 'users' && (currentUser.role === 'admin')) renderUsers(container);
            else if (section === 'addBill' && (currentUser.role === 'admin' || currentUser.role === 'special')) renderAddBill(container);
            else if (section === 'messages') await renderMessages(container);
            else renderDashboard(container);
        } catch (err) {
            container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
        } finally {
            isLoading = false;
        }
        // Update active nav style
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
        if (activeBtn) activeBtn.classList.add('active');
    }

    function logout() { localStorage.clear(); window.location.href = '/'; }

    window.onload = async () => {
        await loadUser();
        await loadData();
        showSection('dashboard');
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
            btn.addEventListener('click', () => showSection(btn.getAttribute('data-section')));
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.warn);
            await setupPush();
        }
    };
</script>
