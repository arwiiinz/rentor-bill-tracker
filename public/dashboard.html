<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Rentor · Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f9fafb">
    <style>
        .message-row.outgoing { justify-content: flex-end !important; }
        .message-row.incoming { justify-content: flex-start !important; }
        .message-bubble.outgoing { background: #2c3e8f !important; color: white !important; }
        .message-bubble.incoming { background: #f3f4f6 !important; color: #1f2937 !important; }
        .bottom-nav .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #unreadBadge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; border-radius: 9999px; padding: 0.15rem 0.4rem; font-size: 0.6rem; font-weight: 600; min-width: 1.2rem; text-align: center; line-height: 1.2; box-shadow: 0 0 0 1px white; z-index: 1; }
        .contact-name { display: inline-flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
        .unread-badge { background: #ef4444; color: white; border-radius: 9999px; padding: 0.1rem 0.4rem; font-size: 0.6rem; font-weight: 600; line-height: 1.2; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="welcome-row">
            <div class="greeting"><h2 id="welcomeMessage">Hello</h2><p id="userDetail"></p></div>
            <div class="role-badge" id="roleBadge"></div>
        </div>
    </div>
    <div class="main-content" id="mainContent"><div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Loading...</div></div>
    <div class="bottom-nav">
        <button class="nav-item" data-section="dashboard"><i class="fas fa-chart-simple"></i><span>Home</span></button>
        <button class="nav-item" data-section="bills"><i class="fas fa-receipt"></i><span>Bills</span></button>
        <button class="nav-item" data-section="messages"><i class="fas fa-envelope"></i><span>Messages</span><span id="unreadBadge" class="badge" style="display:none;">0</span></button>
        <button class="nav-item" id="adminNavBtn" style="display:none;" data-section="users"><i class="fas fa-users"></i><span>Tenants</span></button>
        <button class="nav-item" id="specialNavBtn" style="display:none;" data-section="addBill"><i class="fas fa-plus-circle"></i><span>Add Bill</span></button>
        <button class="nav-item" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Exit</span></button>
    </div>
</div>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/';
    let currentUser = null, allClients = [], allBills = [], socket = null, currentChatUserId = null, currentChatUserName = '', allContacts = [];

    async function apiGet(url) {
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
        return res.json();
    }
    async function apiPost(url, body) {
        const res = await fetch(url, { method: 'POST', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error((await res.json()).error || 'Request failed');
        return res.json();
    }
    async function apiDelete(url) {
        const res = await fetch(url, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error((await res.json()).error || 'Delete failed');
        return res.json();
    }

    async function loadUser() {
        try {
            currentUser = await apiGet('/api/users/me');
            localStorage.setItem('user', JSON.stringify(currentUser));
            document.getElementById('welcomeMessage').innerHTML = `👋 ${currentUser.name.split(' ')[0]}`;
            document.getElementById('userDetail').innerHTML = `${currentUser.room ? `Rm ${currentUser.room} · ` : ''}${currentUser.role === 'client' ? 'Tenant' : currentUser.role}`;
            document.getElementById('roleBadge').innerText = currentUser.role.toUpperCase();
            if (currentUser.role === 'admin') {
                document.getElementById('adminNavBtn').style.display = 'flex';
                document.getElementById('specialNavBtn').style.display = 'flex';
            } else if (currentUser.role === 'special') {
                document.getElementById('specialNavBtn').style.display = 'flex';
            }
        } catch(e) { logout(); }
    }
    async function loadData() {
        try {
            const [clientsRes, billsRes] = await Promise.all([ apiGet('/api/users/clients'), apiGet('/api/bills') ]);
            allClients = clientsRes;
            allBills = billsRes;
        } catch(e) { console.warn(e); }
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
async function printAllReceipts() {
    try {
        const paidBills = allBills.filter(bill => bill.status === 'paid');
        if (!paidBills.length) {
            alert('No paid bills to print.');
            return;
        }

        // Group by client
        const billsByClient = new Map();
        for (const bill of paidBills) {
            const client = bill.clientId;
            if (!client) continue;
            if (!billsByClient.has(client._id)) {
                billsByClient.set(client._id, {
                    name: client.name,
                    room: client.room,
                    level: client.level,
                    bills: [],
                    total: 0
                });
            }
            const group = billsByClient.get(client._id);
            group.bills.push(bill);
            group.total += bill.amount;
        }

        // Build receipt cards
        let allCards = [];
        for (const [clientId, clientData] of billsByClient) {
            clientData.bills.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
            let billsListHtml = '';
            for (const bill of clientData.bills) {
                const dueDate = new Date(bill.dueDate).toLocaleDateString();
                const paidDate = bill.paidDate ? new Date(bill.paidDate).toLocaleDateString() : 'N/A';
                let computationHtml = '';
                if (bill.ratePerKwh !== undefined && bill.ratePerKwh !== null) {
                    const consumption = bill.consumptionKwh ?? 'N/A';
                    const previous = bill.previousReading ?? 'N/A';
                    const current = bill.currentReading ?? 'N/A';
                    const rate = bill.ratePerKwh;
                    const subtotal = (consumption !== 'N/A') ? `₱${(consumption * rate).toFixed(2)}` : 'N/A';
                    computationHtml = `<div style="font-size:0.65rem; color:#4b5563; margin-top:0.1rem; white-space:nowrap; overflow-x:auto;">Prev:${previous} | Cur:${current} | Cons:${consumption} @₱${rate} | Sub:${subtotal}</div>`;
                }
                billsListHtml += `
                    <div style="margin-bottom:0.4rem; border-bottom:1px solid #eef2f6; padding-bottom:0.3rem;">
                        <div style="font-weight:600; font-size:0.8rem;">${escapeHtml(bill.description)}</div>
                        <div style="font-size:0.7rem;">Due:${dueDate} | Paid:${paidDate}</div>
                        <div style="font-size:0.8rem;">Amount: ₱${bill.amount.toLocaleString()}</div>
                        ${computationHtml}
                    </div>
                `;
            }
            allCards.push(`
                <div class="receipt-card">
                    <div class="receipt-header">
                        🧾 ${escapeHtml(clientData.name)} <span style="font-size:0.6rem;">(Rm ${escapeHtml(clientData.room)}, ${escapeHtml(clientData.level)})</span>
                    </div>
                    <div class="receipt-details">
                        ${billsListHtml}
                        <div style="margin-top:0.3rem; font-weight:700; text-align:right; font-size:0.75rem; border-top:1px solid #ccc; padding-top:0.2rem;">
                            TOTAL: ₱${clientData.total.toLocaleString()}
                        </div>
                    </div>
                    <div class="footer">Rentor System</div>
                </div>
            `);
        }

        if (!allCards.length) {
            alert('No valid client data to print.');
            return;
        }

        const cardsPerPage = 8;
        let pagesHtml = '';
        for (let i = 0; i < allCards.length; i += cardsPerPage) {
            let pageCards = allCards.slice(i, i + cardsPerPage);
            while (pageCards.length < cardsPerPage) {
                pageCards.push(`
                    <div class="receipt-card empty-card">
                        <div class="receipt-header"> </div>
                        <div class="receipt-details"> </div>
                        <div class="footer"> </div>
                    </div>
                `);
            }
            pagesHtml += `
                <div class="page-container">
                    <div class="receipt-grid">
                        ${pageCards.join('')}
                    </div>
                </div>
            `;
        }

        const receiptHtml = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Batch Receipts - Paid Bills (Full Page)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: white;
            display: flex;
            flex-direction: column;
        }
        @page {
            size: landscape;
            margin: 0.8cm;
        }
        .page-container {
            page-break-after: always;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .page-container:last-child {
            page-break-after: auto;
        }
        .receipt-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 1fr;
            gap: 0.4rem;
            flex: 1;
            min-height: 0;
            height: 100%;
        }
        .receipt-card {
            border: 1px solid #9ca3af;
            border-radius: 4px;
            padding: 0.5rem;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            height: 100%;
        }
        .empty-card {
            border: 1px dashed #d1d5db;
            background: #f9fafb;
        }
        .receipt-header {
            font-weight: 700;
            font-size: 0.85rem;
            border-bottom: 1px dotted #ccc;
            margin-bottom: 0.2rem;
            padding-bottom: 0.1rem;
            white-space: nowrap;
            overflow-x: auto;
        }
        .receipt-details {
            font-size: 0.7rem;
            line-height: 1.2;
            margin: 0.2rem 0;
            flex: 1;
            overflow-y: auto;
        }
        .footer {
            font-size: 0.55rem;
            text-align: center;
            margin-top: 0.2rem;
            color: #64748b;
        }
        @media print {
            body {
                margin: 0;
                padding: 0;
            }
            .receipt-card {
                border: 1px solid #aaa;
            }
            .empty-card {
                border: 1px solid #ddd;
                background: white;
            }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    ${pagesHtml}
    <div class="no-print" style="text-align:center; margin:1rem;">
        <button onclick="window.print()">🖨️ Print</button>
    </div>
    <script>
        window.onload = () => { window.print(); };
    <\/script>
</body>
</html>`;

        const win = window.open();
        win.document.write(receiptHtml);
        win.document.close();
    } catch (err) {
        console.error(err);
        alert('Print failed: ' + err.message);
    }
}
 function renderDashboard(container) {
    const pending = allBills.filter(b => b.status === 'pending').length;
    const paid = allBills.filter(b => b.status === 'paid').length;
    const totalDue = allBills.filter(b => b.status === 'pending').reduce((s,b) => s + b.amount, 0);
    // Upcoming bills (due in next 7 days)
    const sevenDaysFromNow = new Date();
    sevenDaysFromNow.setDate(sevenDaysFromNow.getDate() + 7);
    let upcoming = allBills.filter(b => b.status === 'pending' && new Date(b.dueDate) <= sevenDaysFromNow);
    upcoming.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
    const upcomingToShow = upcoming.slice(0, 3);  // show only 3 upcoming
    const recent = allBills.slice(0, 3);          // show only 3 recent

    container.innerHTML = `
        <div class="welcome-banner" style="background: linear-gradient(135deg, #2c3e8f 0%, #1a237e 100%); border-radius: 28px; padding: 1.5rem; margin-bottom: 1.5rem; color: white;">
            <div style="font-size: 1.1rem; opacity: 0.9;">Welcome back,</div>
            <div style="font-size: 2rem; font-weight: 700; margin-top: 0.25rem;">${escapeHtml(currentUser.name.split(' ')[0])}!</div>
            <div style="margin-top: 0.5rem; font-size: 0.9rem; opacity: 0.8;">Here's your billing summary</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card" style="background: #fff7ed; border: 1px solid #ffedd5; text-align: center;">
                <div class="stat-number" style="color: #c2410c;">${pending}</div>
                <div class="stat-label">Pending Bills</div>
                <i class="fas fa-hourglass-half" style="color: #c2410c; font-size: 1.2rem; margin-top: 0.25rem;"></i>
            </div>
            <div class="stat-card" style="background: #ecfdf5; border: 1px solid #d1fae5; text-align: center;">
                <div class="stat-number" style="color: #047857;">${paid}</div>
                <div class="stat-label">Paid Bills</div>
                <i class="fas fa-check-circle" style="color: #047857; font-size: 1.2rem; margin-top: 0.25rem;"></i>
            </div>
            <div class="stat-card" style="background: #eff6ff; border: 1px solid #dbeafe; text-align: center;">
                <div class="stat-number" style="color: #1d4ed8;">₱${totalDue.toLocaleString()}</div>
                <div class="stat-label">Total Due</div>
                <i class="fas fa-peso-sign" style="color: #1d4ed8; font-size: 1.2rem; margin-top: 0.25rem;"></i>
            </div>
        </div>
        ${upcomingToShow.length ? `
            <div class="card" style="margin-top: 0.5rem;">
                <div class="card-header" style="background: #fefce8;">
                    <i class="fas fa-calendar-exclamation" style="margin-right: 0.5rem;"></i> Upcoming Bills (next 7 days)
                    ${upcoming.length > 3 ? `<span style="float:right; font-size:0.8rem;"><button class="small" onclick="showSection('bills')">See all ${upcoming.length}</button></span>` : ''}
                </div>
                <div class="card-body" style="padding: 0.5rem 1.25rem;">
                    ${upcomingToShow.map(b => `
                        <div class="bill-item" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0;">
                            <div>
                                <strong>${escapeHtml(b.description)}</strong>
                                <div style="font-size: 0.8rem; color: #b45309;">Due ${new Date(b.dueDate).toLocaleDateString()}</div>
                            </div>
                            <div class="badge badge-pending" style="font-size: 0.8rem;">₱${b.amount.toLocaleString()}</div>
                        </div>
                    `).join('')}
                    ${upcoming.length <= 3 ? '' : `<div style="text-align:center; padding:0.5rem;"><button class="small" onclick="showSection('bills')">View all ${upcoming.length} upcoming bills →</button></div>`}
                </div>
            </div>
        ` : ''}
        <div class="card">
            <div class="card-header">
                <i class="fas fa-receipt" style="margin-right: 0.5rem;"></i> Recent Bills
                ${allBills.length > 3 ? `<span style="float:right; font-size:0.8rem;"><button class="small" onclick="showSection('bills')">See all ${allBills.length}</button></span>` : ''}
            </div>
            <div class="card-body" style="padding: 0.5rem 1.25rem;">
                ${recent.length ? recent.map(b => `
                    <div class="bill-item" style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0;">
                        <div>
                            <strong>${escapeHtml(b.description)}</strong>
                            <div style="font-size: 0.8rem; color: #6b7280;">${b.clientId?.name || 'Unknown'} · ${new Date(b.dueDate).toLocaleDateString()}</div>
                        </div>
                        <div>
                            <span class="badge ${b.status === 'pending' ? 'badge-pending' : 'badge-paid'}">₱${b.amount.toLocaleString()}</span>
                        </div>
                    </div>
                `).join('') : '<div class="empty-state">No bills yet</div>'}
                ${allBills.length <= 3 ? '' : `<div style="text-align:center; padding:0.5rem;"><button class="small" onclick="showSection('bills')">View all bills →</button></div>`}
            </div>
        </div>
    `;
}

    let billsFilter = { search: '', status: 'all', category: 'all' };
async function renderBills(container) {
    if (!allBills.length) {
        container.innerHTML = `<div class="card"><div class="card-body"><div class="empty-state" style="font-size:1.1rem;">📭 No bills found.</div></div></div>`;
        return;
    }

    // Extract categories for filter dropdown
    const categoriesSet = new Set();
    allBills.forEach(b => { if (b.description) categoriesSet.add(b.description); });
    const categories = Array.from(categoriesSet).sort();

    // Apply filters
    let filtered = [...allBills];
    if (billsFilter.search.trim() !== '') {
        const term = billsFilter.search.toLowerCase();
        filtered = filtered.filter(bill => (bill.clientId?.name?.toLowerCase() || '').includes(term) || (bill.description?.toLowerCase() || '').includes(term));
    }
    if (billsFilter.status !== 'all') filtered = filtered.filter(bill => bill.status === billsFilter.status);
    if (billsFilter.category !== 'all') filtered = filtered.filter(bill => bill.description === billsFilter.category);

    // Filter bar HTML (improved)
    const filterBarHtml = `
        <div class="filter-bar-modern" style="background: white; padding: 1rem; border-radius: 24px; margin-bottom: 1.5rem; border:1px solid #eef2f6;">
            <div class="filter-group filter-search" style="flex:2;">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="billsSearchInput" placeholder="Search tenant or bill..." value="${escapeHtml(billsFilter.search)}" style="font-size:0.9rem;">
            </div>
            <div class="filter-group">
                <select id="billsStatusFilter">
                    <option value="all" ${billsFilter.status === 'all' ? 'selected' : ''}>📌 All status</option>
                    <option value="pending" ${billsFilter.status === 'pending' ? 'selected' : ''}>⏳ Pending</option>
                    <option value="paid" ${billsFilter.status === 'paid' ? 'selected' : ''}>✅ Paid</option>
                </select>
            </div>
            <div class="filter-group">
                <select id="billsCategoryFilter">
                    <option value="all" ${billsFilter.category === 'all' ? 'selected' : ''}>📂 All categories</option>
                    ${categories.map(cat => `<option value="${escapeHtml(cat)}" ${billsFilter.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
                </select>
            </div>
            <button class="reset-modern" id="billsResetFiltersBtn"><i class="fas fa-times-circle"></i> Reset</button>
        </div>
    `;


    
    if (filtered.length === 0) {
        container.innerHTML = filterBarHtml + `<div class="empty-state" style="font-size:1.1rem;">🔍 No bills match your filters.</div>`;
        attachFilterEvents();
        // Inside renderBills, after attachFilterEvents() but before building clientsHtml
        // Then when setting container.innerHTML, include it:
        container.innerHTML = batchPrintButton + filterBarHtml + clientsHtml;
        return;
    }
    
    // Group by client
    const billsByClient = new Map();
    for (const bill of filtered) {
        const client = bill.clientId;
        if (!client) continue;
        const clientId = client._id;
        if (!billsByClient.has(clientId)) {
            billsByClient.set(clientId, {
                clientName: client.name,
                clientRoom: client.room,
                clientLevel: client.level,
                bills: []
            });
        }
        billsByClient.get(clientId).bills.push(bill);
    }
    
    let batchPrintButton = '';
    if (currentUser.role === 'admin' || currentUser.role === 'special') {
        batchPrintButton = `<button class="primary-btn" onclick="printAllReceipts()" style="margin-bottom: 1rem; background: #2c3e8f;"><i class="fas fa-print"></i> Print All Tenants (8 per page)</button>`;
    }
    // Build new UI
    let clientsHtml = '';
    for (const [clientId, clientData] of billsByClient) {
        // Group bills by description (category) within each client
        const groupedByDesc = new Map();
        for (const bill of clientData.bills) {
            const desc = bill.description;
            if (!groupedByDesc.has(desc)) groupedByDesc.set(desc, []);
            groupedByDesc.get(desc).push(bill);
        }

        clientsHtml += `
            <div class="bill-client-card">
                <div class="bill-client-header">
                    <i class="fas fa-user-circle"></i> ${escapeHtml(clientData.clientName)}
                    <span style="font-size:0.85rem; font-weight:normal; margin-left:0.5rem; color:#475569;">(Rm ${escapeHtml(clientData.clientRoom)}, ${escapeHtml(clientData.clientLevel)})</span>
                </div>
                <div class="card-body" style="padding:0;">
        `;
        for (const [category, bills] of groupedByDesc) {
            const sortedBills = [...bills].sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
            clientsHtml += `
                <div class="bill-category-group">
                    <div class="bill-category-title">
                        <i class="fas fa-tag"></i> ${escapeHtml(category)}
                    </div>
            `;
            for (const bill of sortedBills) {
                const dueDate = new Date(bill.dueDate);
                const monthYear = dueDate.toLocaleString('default', { month: 'long', year: 'numeric' });
                const isPending = bill.status === 'pending';
                clientsHtml += `
                    <div class="bill-item-row">
                        <div class="bill-item-details">
                            <div class="bill-month">📅 ${monthYear}</div>
                            <div class="bill-amount">₱${bill.amount.toLocaleString()}</div>
                            <span class="badge ${bill.status === 'pending' ? 'badge-pending' : 'badge-paid'}">${bill.status === 'pending' ? '⏳ Pending' : '✅ Paid'}</span>
                        </div>
                        <div class="bill-actions">
                            ${bill.status === 'pending' && (currentUser.role === 'admin' || currentUser.role === 'special') ? 
                                `<button class="mark-paid-btn" onclick="markPaid('${bill._id}')"><i class="fas fa-check-circle"></i> Mark paid</button>` : ''
                            }
                            ${(currentUser.role === 'admin' || currentUser.role === 'special') ? 
                                `<button class="delete-btn" onclick="deleteBill('${bill._id}')"><i class="fas fa-trash-alt"></i> Delete</button>` : ''
                            }
                            ${bill.ratePerKwh !== undefined && bill.ratePerKwh !== null && bill.ratePerKwh > 0 ? 
                                `<button class="compute-btn" onclick="showComputation('${bill._id}')"><i class="fas fa-calculator"></i> Computation</button>` : ''
                            }
                        </div>
                    </div>
                `;
            }
            clientsHtml += `</div>`;
        }
        clientsHtml += `</div></div>`;
    }

    container.innerHTML = batchPrintButton + filterBarHtml + clientsHtml;
    attachFilterEvents();
}




    function attachFilterEvents() {
        const searchInput = document.getElementById('billsSearchInput'), statusSelect = document.getElementById('billsStatusFilter'), categorySelect = document.getElementById('billsCategoryFilter'), resetBtn = document.getElementById('billsResetFiltersBtn');
        const update = () => { billsFilter.search = searchInput ? searchInput.value : ''; billsFilter.status = statusSelect ? statusSelect.value : 'all'; billsFilter.category = categorySelect ? categorySelect.value : 'all'; showSection('bills'); };
        if (searchInput) searchInput.addEventListener('input', update);
        if (statusSelect) statusSelect.addEventListener('change', update);
        if (categorySelect) categorySelect.addEventListener('change', update);

    async function updateUnreadBadge() {

    function initSocket() {
        if (!token) return;
        socket = io({ auth: { token } });
        socket.on('connect', () => console.log('Socket connected'));
        socket.on('new message', (msg) => {
            updateUnreadBadge();
            if (msg.tempId) { replaceOptimisticMessage(msg); return; }
            if (currentChatUserId && (msg.fromUser._id === currentChatUserId || msg.toUser._id === currentChatUserId)) {
                appendIncomingMessage(msg);
                if (msg.fromUser._id === currentChatUserId) socket.emit('message seen', { messageId: msg._id, fromUserId: msg.fromUser._id });
            } else if (document.querySelector('.nav-item.active')?.getAttribute('data-section') === 'messages') {
                renderMessages(document.getElementById('mainContent'));
            }
        });
       socket.on('user typing', ({ fromUserId, isTyping }) => {
    if (currentChatUserId === fromUserId) {
        const ind = document.getElementById('typingIndicator');
        if (ind) ind.style.display = isTyping ? 'block' : 'none';
    }
});
        socket.on('message read', ({ messageId }) => updateMessageStatus(messageId, 'seen'));
        socket.on('disconnect', () => console.log('Socket disconnected'));
    }
    function appendMessageOptimistic(text, tempId) {
        const div = document.getElementById('chatMessages');
        if (!div) return;
        const row = document.createElement('div');
        row.className = 'message-row outgoing';
        row.setAttribute('data-temp-id', tempId);
        row.style.cssText = 'display:flex; width:100%; justify-content:flex-end;';
        row.innerHTML = `<div class="message-bubble outgoing"><div>${escapeHtml(text)}</div><div class="message-meta">Sending... <i class="fas fa-clock"></i></div></div>`;
        div.appendChild(row);
        div.scrollTop = div.scrollHeight;
    }
    function removeTempMessage(tempId) { const el = document.querySelector(`.message-row[data-temp-id="${tempId}"]`); if (el) el.remove(); }
    function replaceOptimisticMessage(realMsg) {
        const el = document.querySelector(`.message-row[data-temp-id="${realMsg.tempId}"]`);
        if (!el) return;
        const isOutgoing = String(realMsg.fromUser._id) === String(currentUser._id);
        const newRow = document.createElement('div');
        newRow.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
        newRow.setAttribute('data-msg-id', realMsg._id);
        newRow.style.cssText = `display:flex; width:100%; justify-content:${isOutgoing ? 'flex-end' : 'flex-start'};`;
        newRow.innerHTML = `<div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}"><div>${escapeHtml(realMsg.message)}</div><div class="message-meta">${new Date(realMsg.createdAt).toLocaleTimeString()} <i class="fas fa-check"></i></div></div>`;
        el.replaceWith(newRow);
    }
    function appendIncomingMessage(msg) {
        const div = document.getElementById('chatMessages');
        if (!div) return;
        const isOutgoing = String(msg.fromUser._id) === String(currentUser._id);
        const row = document.createElement('div');
        row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
        row.setAttribute('data-msg-id', msg._id);
        row.style.cssText = `display:flex; width:100%; justify-content:${isOutgoing ? 'flex-end' : 'flex-start'};`;
        row.innerHTML = `<div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}"><div>${escapeHtml(msg.message)}</div><div class="message-meta">${new Date(msg.createdAt).toLocaleTimeString()} ${isOutgoing ? (msg.isRead ? '<i class="fas fa-check-double"></i>' : '<i class="fas fa-check"></i>') : ''}</div></div>`;
        div.appendChild(row);
        div.scrollTop = div.scrollHeight;
    }
    function updateMessageStatus(messageId, status) {
        const meta = document.querySelector(`.message-row[data-msg-id="${messageId}"] .message-meta`);
        if (meta && status === 'seen') meta.innerHTML = `${new Date().toLocaleTimeString()} <i class="fas fa-check-double"></i>`;
    }
    async function renderMessages(container) {
    updateUnreadBadge();
    container.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading messages...</div>`;
    try {
        let contacts = [];
        let unreadPerContact = {};
        try { contacts = await apiGet('/api/messages/contacts'); } catch(e) { console.warn(e); contacts = []; }
        try { unreadPerContact = await apiGet('/api/messages/unread-per-contact'); } catch(e) { console.warn(e); unreadPerContact = {}; }

        // Admin/Special see all tenants as contacts
        if (currentUser.role === 'admin' || currentUser.role === 'special') {
            const allTenants = allClients.filter(c => c.role === 'client');
            const existingIds = new Set(contacts.map(c => c._id));
            for (const tenant of allTenants) {
                if (!existingIds.has(tenant._id)) {
                    contacts.push({
                        _id: tenant._id,
                        name: tenant.name,
                        username: tenant.username,
                        lastSeen: null
                    });
                }
            }
        }

        // Sort: unread first, then by last message date (if any)
        for (let contact of contacts) {
            try {
                const msgs = await apiGet(`/api/messages?withUserId=${contact._id}`);
                const lastMsg = msgs.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
                contact.lastMsgDate = lastMsg ? new Date(lastMsg.createdAt) : new Date(0);
            } catch(e) { contact.lastMsgDate = new Date(0); }
        }
        contacts.sort((a,b) => {
            const aUnread = unreadPerContact[a._id] || 0;
            const bUnread = unreadPerContact[b._id] || 0;
            if (aUnread !== bUnread) return bUnread - aUnread;
            return b.lastMsgDate - a.lastMsgDate;
        });

        // Build contacts HTML with unread badge and highlight
        let contactsHtml = `<div class="contacts-list">`;
        if (contacts.length === 0) {
            contactsHtml += `<div class="empty-state">No tenants yet. Register some tenants first.</div>`;
        } else {
            for (const contact of contacts) {
                const isOnline = contact.lastSeen && (new Date() - new Date(contact.lastSeen) < 120000);
                const unreadCount = unreadPerContact[contact._id] || 0;
                const avatarInitial = contact.name.charAt(0).toUpperCase();
                const unreadClass = unreadCount > 0 ? 'contact-unread' : '';
                contactsHtml += `
                    <div class="contact-item ${unreadClass}" data-user-id="${contact._id}" data-user-name="${contact.name}">
                        <div class="avatar-wrapper">
                            <div class="avatar">${avatarInitial}</div>
                            ${isOnline ? '<div class="online-dot"></div>' : ''}
                        </div>
                        <div class="contact-info">
                            <div class="contact-name">
                                ${escapeHtml(contact.name)}
                                ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
                            </div>
                            <div class="contact-lastseen">${isOnline ? 'Online' : (contact.lastSeen ? `Last seen ${new Date(contact.lastSeen).toLocaleString()}` : 'Offline')}</div>
                        </div>
                    </div>
                `;
            }
        }
        contactsHtml += `</div>`;

        // Chat panel
        const chatHtml = `
            <div class="chat-panel">
                <div class="chat-view" id="chatView">
                    <div class="back-to-contacts"><button class="small" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button></div>
                    <div style="display:flex; justify-content:space-between; padding:1rem; border-bottom:1px solid #eee;">
                        <div class="chat-header" id="chatHeader"></div>
                        <button id="deleteConversationBtn" class="small" style="background:#fee2e2; color:#b91c1c;">Delete</button>
                    </div>
                    <div class="chat-messages" id="chatMessages"><div class="empty-state">Click a contact to start messaging</div></div>
                    <div id="typingIndicator" style="display:none; padding:0.25rem 1rem;">Typing...</div>
                    <div class="chat-input">
                        <input id="chatInput" placeholder="Type a message..." disabled>
                        <button class="primary-btn" id="sendChatBtn" disabled>Send</button>
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = `<div class="messenger-container"><div class="contacts-panel">${contactsHtml}</div>${chatHtml}</div>`;
        allContacts = contacts;

        // Event handlers
        document.querySelectorAll('.contact-item').forEach(el => {
            el.addEventListener('click', async () => {
                document.querySelectorAll('.contact-item').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                const userId = el.getAttribute('data-user-id');
                const userName = el.getAttribute('data-user-name');
                await openChat(userId, userName);
            });
        });

        document.getElementById('backBtn')?.addEventListener('click', () => {
            document.getElementById('chatView').style.display = 'none';
            currentChatUserId = null;
        });

        const chatInput = document.getElementById('chatInput');
        let typingTimeout = null;
        chatInput?.addEventListener('input', () => {
            if (socket?.connected && currentChatUserId) {
                socket.emit('typing', { toUserId: currentChatUserId, isTyping: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => socket.emit('typing', { toUserId: currentChatUserId, isTyping: false }), 1000);
            }
        });

        const sendBtn = document.getElementById('sendChatBtn');
        const sendMessage = async () => {
            if (!currentChatUserId) return;
            const text = chatInput.value.trim();
            if (!text) return;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i>';
            const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
            appendMessageOptimistic(text, tempId);
            chatInput.value = '';
            if (socket?.connected) {
                socket.emit('private message', { toUserId: currentChatUserId, message: text, tempId });
                setTimeout(() => {
                    const stillThere = document.querySelector(`.message-row[data-temp-id="${tempId}"]`);
                    if (stillThere) {
                        console.warn('Optimistic not replaced, reloading chat');
                        openChat(currentChatUserId, currentChatUserName);
                    }
                    if (sendBtn.disabled) { sendBtn.disabled = false; sendBtn.innerHTML = 'Send'; }
                }, 2000);
            } else {
                try {
                    const recipient = [...allContacts, ...allClients].find(c => String(c._id) === String(currentChatUserId));
                    if (!recipient) throw new Error('Recipient not found');
                    await apiPost('/api/messages', { toUsername: recipient.username, subject: 'Chat', message: text });
                    await openChat(currentChatUserId, currentChatUserName);
                } catch(err) { alert(err.message); removeTempMessage(tempId); }
                finally { sendBtn.disabled = false; sendBtn.innerHTML = 'Send'; }
            }
        };
        sendBtn?.addEventListener('click', sendMessage);
        chatInput?.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    } catch(err) {
        container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    }
}
async function openChat(userId, userName) {
    currentChatUserId = userId;
    currentChatUserName = userName;
    const chatView = document.getElementById('chatView');
    const chatHeader = document.getElementById('chatHeader');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendChatBtn');
    const deleteBtn = document.getElementById('deleteConversationBtn');

    if (!chatView || !chatHeader || !chatMessagesDiv) return;

    // Enable input and send button
    if (chatInput) chatInput.disabled = false;
    if (sendBtn) sendBtn.disabled = false;

    chatHeader.innerHTML = `<span><i class="fas fa-user-circle"></i> ${escapeHtml(userName)}</span>`;
    chatMessagesDiv.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> Loading messages...</div>';
    chatView.style.display = 'flex';
    if (window.innerWidth <= 600) chatView.classList.add('active-mobile');

    try {
        const messages = await apiGet(`/api/messages?withUserId=${userId}`);
        const sorted = [...messages].sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
        chatMessagesDiv.innerHTML = '';
        if (sorted.length === 0) {
            chatMessagesDiv.innerHTML = '<div class="empty-state">No messages yet. Send a message to start the conversation.</div>';
            return;
        }

        for (const msg of sorted) {
            const senderId = msg.fromUser._id ? msg.fromUser._id : msg.fromUser;
            const isOutgoing = String(senderId) === String(currentUser._id);
            const row = document.createElement('div');
            row.className = `message-row ${isOutgoing ? 'outgoing' : 'incoming'}`;
            row.setAttribute('data-msg-id', msg._id);
            row.style.cssText = `display:flex; width:100%; justify-content:${isOutgoing ? 'flex-end' : 'flex-start'};`;
            row.innerHTML = `
                <div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}">
                    <div>${escapeHtml(msg.message)}</div>
                    <div class="message-meta">
                        ${new Date(msg.createdAt).toLocaleTimeString()}
                        ${isOutgoing ? (msg.isRead ? '<i class="fas fa-check-double"></i>' : '<i class="fas fa-check"></i>') : ''}
                    </div>
                </div>
            `;
            chatMessagesDiv.appendChild(row);
        }
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;

        deleteBtn.onclick = async () => {
            if (confirm('Delete entire conversation?')) {
                await apiDelete(`/api/messages/conversation/${userId}`);
                alert('Conversation deleted');
                if (chatInput) chatInput.disabled = true;
                if (sendBtn) sendBtn.disabled = true;
                chatMessagesDiv.innerHTML = '<div class="empty-state">Conversation deleted. Select another contact.</div>';
                chatHeader.innerHTML = '<span>Select a contact</span>';
                currentChatUserId = null;
                chatView.style.display = 'none';
                renderMessages(document.getElementById('mainContent'));
            }
        };
    } catch (err) {
        chatMessagesDiv.innerHTML = '<div class="empty-state">Failed to load messages.</div>';
    }
}
let isLoading = false;
async function showSection(section) {
    if (isLoading) return;
    isLoading = true;
    const container = document.getElementById('mainContent');
    container.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse fa-2x"></i><br>Loading ${section}...</div>`;

    try {
        if (section !== 'messages') await loadData();
        else await loadData();

        if (section === 'dashboard') renderDashboard(container);
        else if (section === 'bills') renderBills(container);
        else if (section === 'users' && currentUser.role === 'admin') renderUsers(container);
        else if (section === 'addBill' && (currentUser.role === 'admin' || currentUser.role === 'special')) renderAddBill(container);
        else if (section === 'messages') await renderMessages(container);
        else renderDashboard(container);
    } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
    } finally {
        isLoading = false;
        // Calculate header height (including any sticky elements)
        const header = document.querySelector('.header');
        const headerHeight = header ? header.offsetHeight : 0;
        // Scroll to top of main content, accounting for header height
        window.scrollTo({ top: headerHeight, behavior: 'smooth' });
        // Alternative: scroll to the main container
        container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // Then adjust for header if needed
        if (headerHeight > 0) {
            window.scrollBy({ top: -headerHeight, behavior: 'smooth' });
        }
    }

    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
    const activeBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
    if (activeBtn) activeBtn.classList.add('active');
}


   
    function logout() { localStorage.clear(); window.location.href = '/'; }
    async function setupPush() {}
    window.onload = async () => {
        await loadUser();
        await loadData();
        showSection('dashboard');
        initSocket();
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.querySelectorAll('.nav-item[data-section]').forEach(btn => btn.addEventListener('click', () => showSection(btn.getAttribute('data-section'))));
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.warn);
        setInterval(async () => { if (token) try { await fetch('/api/heartbeat', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); } catch(e) {} }, 30000);
    };

    window.showComputation = async (billId) => {
    try {
        const bill = await apiGet(`/api/bills/${billId}`);
        if (!bill) return;
        // Build modal content
        let rows = `
            <div class="modal-overlay" id="computationModal">
                <div class="modal-content">
                    <h3>Bill Computation</h3>
                    <table>
                        <tr><td>Description:</td><td>${escapeHtml(bill.description)}</td></tr>
                        <tr><td>Previous Reading:</td><td>${bill.previousReading ?? 'N/A'} kWh</td></tr>
                        <tr><td>Current Reading:</td><td>${bill.currentReading ?? 'N/A'} kWh</td></tr>
                        <tr><td>Consumption:</td><td>${bill.consumptionKwh ?? 'N/A'} kWh</td></tr>
                        <tr><td>Rate per kWh:</td><td>₱${bill.ratePerKwh ?? '0'}</td></tr>
                        <tr><td>Subtotal:</td><td>₱${((bill.consumptionKwh || 0) * (bill.ratePerKwh || 0)).toFixed(2)}</td></tr>
                        <tr><td>Minimum Amount:</td><td>${bill.minimumAmount ? `₱${bill.minimumAmount}` : 'None'}</td></tr>
                        <tr><td><strong>Final Amount:</strong></td><td><strong>₱${bill.amount.toFixed(2)}</strong></td></tr>
                    </table>
                    <button class="primary-btn" onclick="closeComputationModal()">Close</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', rows);
    } catch(err) {
        alert('Failed to load computation details: ' + err.message);
    }
};

window.closeComputationModal = () => {
    const modal = document.getElementById('computationModal');
    if (modal) modal.remove();
};
